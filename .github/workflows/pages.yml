name: Deploy UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/site/**'
      - 'wiremock-extension-ui/src/main/resources/ui/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Assemble Interactive Demo from UI Extension Sources
        run: |
          mkdir -p docs/site/demo
          cp -r wiremock-extension-ui/src/main/resources/ui/* docs/site/demo/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
