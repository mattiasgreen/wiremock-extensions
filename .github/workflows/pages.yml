name: Deploy UI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'wiremock-extension-ui/src/main/resources/ui/**'
      - 'WireMockConsoleProxy.java'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage Artifacts
        run: |
          mkdir -p build/gh-pages
          cp -r wiremock-extension-ui/src/main/resources/ui/. build/gh-pages/
          cp WireMockConsoleProxy.java build/gh-pages/WireMockConsoleProxy.java

      - name: Upload Static UI Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
