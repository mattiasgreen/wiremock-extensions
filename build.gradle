plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'com.diffplug.spotless' version '7.0.2'
    alias(libs.plugins.spotbugs) apply false
}

allprojects {
    group = 'io.github.mattiasgreen'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.spotbugs'

    if (project.name != 'wiremock-examples') {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'
    }

    spotless {
        java {
            palantirJavaFormat('2.50.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Werror', '-parameters']
        options.encoding = 'UTF-8'
    }

    dependencies {
        spotbugsPlugins libs.findsecbugs.plugin
        compileOnly libs.wiremock
        testImplementation libs.wiremock

        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
        testImplementation libs.assertj.core
        testImplementation libs.logback.classic
    }

    spotbugs {
        ignoreFailures = false
        effort = 'max'
        reportLevel = 'low'
        excludeFilter = rootProject.file('config/spotbugs/spotbugs-exclude.xml')
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html {
                required = true
            }
            xml {
                required = true
            }
        }
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        if (name.endsWith('Test')) {
            enabled = false
        }
    }

    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'recording'
        }
    }

    if (project.name != 'wiremock-examples') {
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    pom {
                        name = project.name
                        description = "WireMock Standalone Extension: ${project.name}"
                        url = "https://github.com/mattiasgreen/wiremock-extensions"

                        licenses {
                            license {
                                name = "The Apache License, Version 2.0"
                                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                            }
                        }
                        developers {
                            developer {
                                id = "mattiasgreen"
                                name = "Mattias Green"
                                email = "mattias.green@gmail.com"
                            }
                        }
                        scm {
                            connection = "scm:git:git://github.com/mattiasgreen/wiremock-extensions.git"
                            developerConnection = "scm:git:ssh://github.com/mattiasgreen/wiremock-extensions.git"
                            url = "https://github.com/mattiasgreen/wiremock-extensions"
                        }
                    }
                }
            }
        }
    }
}
