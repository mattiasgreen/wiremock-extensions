plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
    id 'com.diffplug.spotless' version '7.0.2'
    alias(libs.plugins.spotbugs) apply false
    id 'com.gradleup.nmcp.aggregation' version '1.6.2'
}

allprojects {
    group = 'io.github.mattiasgreen'
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.spotbugs'

    if (project.name != 'wiremock-examples') {
        apply plugin: 'maven-publish'
        apply plugin: 'signing'
        apply plugin: 'com.gradleup.nmcp'
    }


    spotless {
        java {
            palantirJavaFormat('2.50.0')
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all', '-Xlint:-processing', '-Werror', '-parameters']
        options.encoding = 'UTF-8'
    }

    dependencies {
        spotbugsPlugins libs.findsecbugs.plugin
        compileOnly libs.wiremock
        testImplementation libs.wiremock

        testImplementation libs.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
        testImplementation libs.assertj.core
        testImplementation libs.logback.classic
    }

    spotbugs {
        ignoreFailures = false
        effort = 'max'
        reportLevel = 'low'
        excludeFilter = rootProject.file('config/spotbugs/spotbugs-exclude.xml')
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html {
                required = true
            }
            xml {
                required = true
            }
        }
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        if (name.endsWith('Test')) {
            enabled = false
        }
    }

    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'recording'
        }
    }

    if (project.name != 'wiremock-examples') {
        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    pom {
                        name = project.name
                        description = "WireMock Standalone Extension: ${project.name}"
                        url = "https://github.com/mattiasgreen/wiremock-extensions"

                        licenses {
                            license {
                                name = "The Apache License, Version 2.0"
                                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                            }
                        }
                        developers {
                            developer {
                                id = "mattiasgreen"
                                name = "Mattias Green"
                                email = "mattias.green@gmail.com"
                            }
                        }
                        scm {
                            connection = "scm:git:git://github.com/mattiasgreen/wiremock-extensions.git"
                            developerConnection = "scm:git:ssh://github.com/mattiasgreen/wiremock-extensions.git"
                            url = "https://github.com/mattiasgreen/wiremock-extensions"
                        }
                    }
                }
            }
        }

        signing {
            def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
            def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')

            if (signingKey != null) {
                useInMemoryPgpKeys(signingKey as String, signingPassword as String)
            } else {
                if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
                    def gitGpg = new File('C:/Program Files/Git/usr/bin/gpg.exe')
                    if (gitGpg.exists() && !project.hasProperty('signing.gnupg.executable')) {
                        project.ext.set('signing.gnupg.executable', gitGpg.absolutePath)
                    }
                }
                useGpgCmd()
            }
            required = {
                gradle.taskGraph.allTasks.any {
                    it.name.startsWith('publish') || it.name.startsWith('publishAll')
                }
            }
            sign publishing.publications.mavenJava
        }
    }
}

nmcpAggregation {
    centralPortal {
        username = findProperty('sonatypeUsername') ?: System.getenv('MAVEN_CENTRAL_USERNAME')
        password = findProperty('sonatypePassword') ?: System.getenv('MAVEN_CENTRAL_PASSWORD')
        publishingType = 'USER_MANAGED'
    }
}
