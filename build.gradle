plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

allprojects {
    group = 'io.github.mattiasgreen'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        compileOnly 'org.wiremock:wiremock:3.12.1'
        testImplementation 'org.wiremock:wiremock:3.12.1'

        testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
        testImplementation 'org.assertj:assertj-core:3.27.3'
        testImplementation 'ch.qos.logback:logback-classic:1.5.16'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                pom {
                    name = project.name
                    description = "WireMock Standalone Extension: ${project.name}"
                    url = "https://github.com/mattiasgreen/wiremock-extensions"

                    licenses {
                        license {
                            name = "The Apache License, Version 2.0"
                            url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                        }
                    }
                    developers {
                        developer {
                            id = "mattiasgreen"
                            name = "Mattias Green"
                            email = "mattias.green@gmail.com"
                        }
                    }
                    scm {
                        connection = "scm:git:git://github.com/mattiasgreen/wiremock-extensions.git"
                        developerConnection = "scm:git:ssh://github.com/mattiasgreen/wiremock-extensions.git"
                        url = "https://github.com/mattiasgreen/wiremock-extensions"
                    }
                }
            }
        }
    }
}
