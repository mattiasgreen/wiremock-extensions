sourceSets {
    quarkusTest {
        java.srcDir file('src/quarkusTest/java')
        resources.srcDir file('src/quarkusTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.test.output + configurations.testCompileClasspath
        runtimeClasspath += output + compileClasspath + configurations.testRuntimeClasspath
    }
}

configurations {
    quarkusTestImplementation.extendsFrom testImplementation
    quarkusTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    api libs.casual.api
    api libs.casual.network
    api libs.casual.network.protocol
    api libs.casual.json.provider.gson
    implementation libs.netty.all
    implementation libs.jackson.databind
    implementation 'jakarta.enterprise.concurrent:jakarta.enterprise.concurrent-api:3.0.3'
    testImplementation project(':wiremock-extension-tcp-netem')
}

tasks.register('quarkusIntegrationTest', Test) {
    description = 'Runs multi-node Casual 2PC/XA integration tests (Client Initiator -> WireMock MitM -> Upstream Server).'
    group = 'verification'
    testClassesDirs = sourceSets.quarkusTest.output.classesDirs
    classpath = sourceSets.quarkusTest.runtimeClasspath
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    systemProperty 'CASUAL_OUTBOUND_UNMANAGED', 'true'
    systemProperty 'CASUAL_UNMANAGED', 'true'
    environment 'CASUAL_OUTBOUND_UNMANAGED', 'true'
    environment 'CASUAL_UNMANAGED', 'true'
}

tasks.register('clientJar', Jar) {
    group = 'build'
    description = 'Assembles a standalone, executable fat-jar for the CasualClient CLI.'
    archiveBaseName = 'wiremock-casual-client'
    archiveClassifier = ''
    manifest {
        attributes(
            'Main-Class': 'com.github.mattiasgreen.wiremock.casual.CasualClient',
            'Implementation-Title': 'WireMock Casual Standalone Client',
            'Implementation-Version': project.version
        )
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


