[versions]
wiremock = "3.12.1"
junit = "5.11.4"
junit-platform = "1.11.4"
assertj = "3.27.3"
logback = "1.5.16"
jackson = "2.18.2"
playwright = "1.49.0"
animated-gif-lib = "1.4"
logstash-logback-encoder = "8.0"
opentelemetry = "1.47.0"
opentelemetry-alpha = "1.47.0-alpha"
prometheus = "1.3.6"
swagger-parser = "2.1.25"
spotbugs-plugin = "6.1.7"
findsecbugs = "1.14.0"

[libraries]
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
animated-gif-lib = { module = "com.madgag:animated-gif-lib", version.ref = "animated-gif-lib" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback-encoder" }

opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk", version.ref = "opentelemetry" }
opentelemetry-exporter-prometheus = { module = "io.opentelemetry:opentelemetry-exporter-prometheus", version.ref = "opentelemetry-alpha" }

prometheus-metrics-core = { module = "io.prometheus:prometheus-metrics-core", version.ref = "prometheus" }
prometheus-metrics-exporter-common = { module = "io.prometheus:prometheus-metrics-exporter-common", version.ref = "prometheus" }
prometheus-metrics-exposition-formats = { module = "io.prometheus:prometheus-metrics-exposition-formats", version.ref = "prometheus" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser", version.ref = "swagger-parser" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

[plugins]
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs-plugin" }
