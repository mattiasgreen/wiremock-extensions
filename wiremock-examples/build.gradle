dependencies {
    implementation project(':wiremock-extension-bundle')
    implementation libs.wiremock
    implementation libs.jackson.databind
    implementation libs.jackson.datatype.jsr310

    testImplementation libs.playwright
    testImplementation libs.resilience4j.circuitbreaker
    testImplementation libs.resilience4j.retry
    testImplementation libs.kafka.clients
    testImplementation libs.protonj2.client
    testImplementation libs.artemis.server
    testImplementation libs.artemis.amqp.protocol
}

tasks.register('recordDemoVideos', Test) {
    group = 'verification'
    description = 'Generates Playwright WebM demo video tour for Banking Progressive Simulation'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'recording'
    }
}

