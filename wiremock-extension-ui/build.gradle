tasks.named('processResources') {
    def ver = project.version.toString()
    def repoDir = rootProject.projectDir
    inputs.property('version', ver)

    doLast {
        def resolveGit = { List<String> gitArgs ->
            try {
                def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
                def cmd = isWindows ? (['cmd', '/c', 'git'] + gitArgs) : (['git'] + gitArgs)
                def proc = new ProcessBuilder(cmd).directory(repoDir).redirectErrorStream(true).start()
                def out = proc.inputStream.getText('UTF-8').trim()
                proc.waitFor()
                return (proc.exitValue() == 0 && out && !out.contains('fatal')) ? out : null
            } catch (Exception ignored) {
                return null
            }
        }

        // 1. Resolve Git Commit (short hash)
        def commit = System.getenv('GITHUB_SHA') ? System.getenv('GITHUB_SHA').take(7) : null
        if (!commit) {
            commit = resolveGit(['rev-parse', '--short', 'HEAD'])
        }
        if (!commit) commit = 'unknown'

        // 2. Resolve Git Branch
        def branch = System.getenv('GITHUB_REF_NAME') ?: System.getenv('GITHUB_HEAD_REF')
        if (!branch || branch == 'HEAD') {
            def gitBranch = resolveGit(['rev-parse', '--abbrev-ref', 'HEAD'])
            if (gitBranch && gitBranch != 'HEAD') {
                branch = gitBranch
            }
        }
        if (!branch || branch == 'HEAD') branch = 'main'

        // 3. Write / update version.json in build output
        def versionJsonFile = new File(destinationDir, 'ui/version.json')
        def versionJsonContent = "{\n  \"version\": \"${ver}\",\n  \"commit\": \"${commit}\",\n  \"branch\": \"${branch}\"\n}\n"
        if (!versionJsonFile.exists() || versionJsonFile.getText('UTF-8') != versionJsonContent) {
            versionJsonFile.parentFile.mkdirs()
            versionJsonFile.write(versionJsonContent, 'UTF-8')
        }

        // 4. Update index.html badge in build output
        def indexHtmlFile = new File(destinationDir, 'ui/index.html')
        if (indexHtmlFile.exists()) {
            def html = indexHtmlFile.getText('UTF-8')
            def badgeHtml = "<span id=\"app-version-badge\" class=\"brand-version-badge\" title=\"WireMock Extensions v${ver} | Branch: ${branch} | Commit: ${commit}\">v${ver} (${branch}@${commit})</span>"
            def updatedHtml = html.replaceAll(
                /<span id="app-version-badge" class="brand-version-badge"[^>]*>.*?<\/span>/,
                java.util.regex.Matcher.quoteReplacement(badgeHtml)
            )
            if (html != updatedHtml) {
                indexHtmlFile.write(updatedHtml, 'UTF-8')
            }
        }

        // 5. Update demo-backend.js mock version response in build output
        def demoBackendFile = new File(destinationDir, 'ui/modules/demo-backend.js')
        if (demoBackendFile.exists()) {
            def js = demoBackendFile.getText('UTF-8')
            def updatedJs = js.replaceAll(
                /(pathname === '\/__admin\/ui\/version'[\s\S]*?version:\s*')[^']+('[\s\S]*?branch:\s*')[^']+('[\s\S]*?commit:\s*')[^']+(')/,
                "\$1" + java.util.regex.Matcher.quoteReplacement(ver) + "\$2" + java.util.regex.Matcher.quoteReplacement(branch) + "\$3" + java.util.regex.Matcher.quoteReplacement(commit) + "\$4"
            )
            if (js != updatedJs) {
                demoBackendFile.write(updatedJs, 'UTF-8')
            }
        }
    }
}

tasks.register('syncDemoSite', Copy) {
    group = 'documentation'
    description = 'Syncs single-source-of-truth UI assets into docs/site/demo for local static site preview'
    dependsOn 'processResources'
    from(new File(tasks.named('processResources').get().destinationDir, 'ui')) {
        exclude 'pitch/**'
    }
    into rootProject.file('docs/site/demo')
}

rootProject.tasks.matching { it.name.startsWith('spotless') }.configureEach {
    mustRunAfter tasks.named('syncDemoSite')
}

tasks.named('test') {
    systemProperty 'ui.profile', System.getProperty('ui.profile', 'false')
}

