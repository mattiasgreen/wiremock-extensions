dependencies {
    testImplementation project(':wiremock-extension-openapi')
    testImplementation project(':wiremock-extension-stateful')
    testImplementation project(':wiremock-extension-tcp-netem')
    testImplementation libs.playwright
    testImplementation libs.jackson.databind
    testImplementation libs.animated.gif.lib
}

tasks.register('recordDemoGifs', Test) {
    group = 'verification'
    description = 'Generates animated demo GIFs for UI documentation via Playwright'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'recording'
    }
}

tasks.register('recordPitchDeckScreenshots', Test) {
    group = 'verification'
    description = 'Generates high-resolution screenshots for the pitch deck presentation via Playwright'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'pitch-deck'
    }
}

tasks.register('captureUiSnapshots', Test) {
    group = 'verification'
    description = 'Generates visual screenshots of Web SPA and Native Desktop Swing for agentic UX inspection'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ui-snapshot'
    }
}

tasks.register('runProxy', JavaExec) {
    group = 'application'
    description = 'Launches the headless WireMock Console Proxy (WireMockConsoleProxy)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.ui.WireMockConsoleProxy'
    args = [project.findProperty('wiremock.url') ?: 'http://localhost:8080']
}

