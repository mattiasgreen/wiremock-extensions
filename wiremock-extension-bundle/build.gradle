apply plugin: 'application'

configurations {
    standaloneRuntime {
        canBeResolved = false
        canBeConsumed = false
    }
    runtimeClasspath {
        extendsFrom standaloneRuntime
    }
}

dependencies {
    api project(':wiremock-extension-json-logging')
    api project(':wiremock-extension-otel')
    api project(':wiremock-extension-openapi')
    api project(':wiremock-extension-stateful')
    api project(':wiremock-extension-ui')
    api project(':wiremock-extension-tcp-netem')

    standaloneRuntime libs.wiremock
    standaloneRuntime libs.logback.classic
}

application {
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
}

tasks.register('runStandalone', JavaExec) {
    group = 'application'
    description = 'Runs WireMock standalone with all extensions, TCP NetEm, Casual gateway, and active UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
}

tasks.register('runUpstream', JavaExec) {
    group = 'application'
    description = 'Runs simulated upstream mock service on port 8089 for live proxy testing'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.UpstreamMockServer'
}
