apply plugin: 'application'

configurations {
    standaloneRuntime {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom configurations.runtimeClasspath
    }
}

dependencies {
    api project(':wiremock-extension-json-logging')
    api project(':wiremock-extension-otel')
    api project(':wiremock-extension-ui')

    standaloneRuntime 'org.wiremock:wiremock:3.12.1'
    standaloneRuntime 'ch.qos.logback:logback-classic:1.5.16'
}

application {
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
}

tasks.named('run') {
    classpath = sourceSets.main.output + configurations.standaloneRuntime
}

tasks.register('runStandalone', JavaExec) {
    group = 'application'
    description = 'Runs WireMock standalone with all QoL extensions and sample mocks'
    classpath = sourceSets.main.output + configurations.standaloneRuntime
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
}

