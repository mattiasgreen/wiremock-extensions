apply plugin: 'application'
apply plugin: 'com.gradleup.shadow'

configurations {
    standaloneRuntime {
        canBeResolved = false
        canBeConsumed = false
    }
    runtimeClasspath {
        extendsFrom standaloneRuntime
    }
}

dependencies {
    api project(':wiremock-extension-json-logging')
    api project(':wiremock-extension-otel')
    api project(':wiremock-extension-openapi')
    api project(':wiremock-extension-stateful')
    api project(':wiremock-extension-ui')
    api project(':wiremock-extension-tcp-netem')
    api project(':wiremock-extension-casual')
    api project(':wiremock-extension-async')

    standaloneRuntime libs.wiremock
    standaloneRuntime libs.logback.classic
}

application {
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
}

tasks.register('runStandalone', JavaExec) {
    group = 'application'
    description = 'Runs WireMock standalone with all extensions, TCP NetEm, Casual gateway, and active UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
    if (project.hasProperty('args')) {
        args project.property('args').toString().split('\\s+')
    }
}

tasks.register('runUpstream', JavaExec) {
    group = 'application'
    description = 'Runs simulated upstream mock service on port 8089 for live proxy testing'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.UpstreamMockServer'
}

shadowJar {
    archiveClassifier.set('standalone')
    mergeServiceFiles()
    manifest {
        attributes(
            'Main-Class': 'com.github.tomakehurst.wiremock.standalone.WireMockServerRunner',
            'Implementation-Title': 'WireMock Standalone with Extensions',
            'Implementation-Version': project.version
        )
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.register('fatJar') {
    group = 'build'
    description = 'Builds the standalone executable fat-jar containing WireMock and all extensions'
    dependsOn tasks.named('shadowJar')
}

tasks.named('test') {
    dependsOn tasks.named('shadowJar')
}
