apply plugin: 'application'
apply plugin: 'com.gradleup.shadow'

configurations {
    standaloneRuntime {
        canBeResolved = false
        canBeConsumed = false
    }
    runtimeClasspath {
        extendsFrom standaloneRuntime
    }
    ibmmqRuntime {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom runtimeClasspath
    }
}

dependencies {
    api project(':wiremock-extension-json-logging')
    api project(':wiremock-extension-otel')
    api project(':wiremock-extension-openapi')
    api project(':wiremock-extension-stateful')
    api project(':wiremock-extension-ui')
    api project(':wiremock-extension-tcp-netem')
    api project(':wiremock-extension-casual')
    api project(':wiremock-extension-async')
    api project(':wiremock-extension-journal')

    standaloneRuntime libs.wiremock
    standaloneRuntime libs.logback.classic
    ibmmqRuntime libs.ibm.mq.allclient

    testImplementation libs.artemis.server
    testImplementation libs.artemis.amqp.protocol
}

application {
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
}

tasks.register('runStandalone', JavaExec) {
    group = 'application'
    description = 'Runs WireMock standalone with all extensions, TCP NetEm, Casual gateway, and active UI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServer'
    if (project.hasProperty('args')) {
        args project.property('args').toString().split('\\s+')
    }
}

tasks.register('runWithArtemis', JavaExec) {
    group = 'application'
    description = 'Runs WireMock standalone with embedded ActiveMQ Artemis AMQP 1.0 broker and configured connection'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.StandaloneDevServerWithArtemis'
    if (project.hasProperty('args')) {
        args project.property('args').toString().split('\\s+')
    }
}

tasks.register('runUpstream', JavaExec) {
    group = 'application'
    description = 'Runs simulated upstream mock service on port 8089 for live proxy testing'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.github.mattiasgreen.wiremock.bundle.UpstreamMockServer'
}

def configureStandaloneShadow = { task, String classifier ->
    task.archiveClassifier.set(classifier)
    task.mergeServiceFiles()
    task.manifest {
        attributes(
            'Main-Class': 'com.github.tomakehurst.wiremock.standalone.WireMockServerRunner',
            'Implementation-Title': 'WireMock Standalone with Extensions',
            'Implementation-Version': project.version
        )
    }
    task.exclude 'META-INF/*.SF'
    task.exclude 'META-INF/*.DSA'
    task.exclude 'META-INF/*.RSA'
}

shadowJar {
    configureStandaloneShadow(it, 'standalone')
}

tasks.register('shadowJarIbmMq', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'Builds an opt-in standalone fat-jar bundled with IBM MQ client libraries'
    from sourceSets.main.output
    configurations = [project.configurations.ibmmqRuntime]
    configureStandaloneShadow(it, 'standalone-ibmmq')
}

tasks.register('fatJar') {
    group = 'build'
    description = 'Builds the lean standalone executable fat-jar containing WireMock and all open extensions'
    dependsOn tasks.named('shadowJar')
}

tasks.register('fatJarIbmMq') {
    group = 'build'
    description = 'Builds the opt-in standalone executable fat-jar bundled with IBM MQ allclient'
    dependsOn tasks.named('shadowJarIbmMq')
}

tasks.named('test') {
    dependsOn tasks.named('shadowJar')
}
